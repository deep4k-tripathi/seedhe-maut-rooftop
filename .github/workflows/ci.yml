name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # tracks.json is generated. If it drifts from curation.txt the set on the live site
  # is not the set in the repo, so fail loudly rather than let them diverge.
  tracks-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Compares trackIds only. Preview URLs are excluded because Apple rotates those
      # asset paths, which would otherwise fail runs where nothing really changed.
      - name: Check tracks.json matches curation.txt
        run: node scripts/resolve-tracks.mjs --check
