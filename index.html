<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SM Nation</title>
    <meta
      name="description"
      content="A Delhi rooftop at night that plays Seedhe Maut. Curated previews, live headcount, full tracks a click away."
    />
    <meta name="theme-color" content="#07070a" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="SM Nation" />
    <meta
      property="og:description"
      content="A Delhi rooftop at night that plays Seedhe Maut."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://audio-ssl.itunes.apple.com" crossorigin />
    <link rel="preconnect" href="https://is1-ssl.mzstatic.com" />

    <!-- The scene's end card. Loaded async so it never blocks the first paint;
         Georgia and the system sans stand in until it arrives. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Barlow:wght@300&display=swap"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307070a'/%3E%3Ctext x='16' y='22' font-size='16' font-family='sans-serif' font-weight='bold' fill='%23c1272d' text-anchor='middle'%3ESM%3C/text%3E%3C/svg%3E"
    />
  </head>

  <body>
    <div id="scene"></div>

    <div class="ui">
      <header class="topbar">
        <div class="mark">
          SM Nation
          <span id="setlist"></span>
        </div>

        <div class="controls">
          <div class="live" id="live" data-ready="false">
            <i class="dot"></i><b id="live-count">0</b><span class="live-label">on the roof</span>
          </div>
          <nav class="links" id="links"></nav>
        </div>
      </header>

      <div></div>

      <footer>
        <div class="dock" id="dock" hidden></div>
      </footer>
    </div>

    <div class="notice" id="notice" hidden></div>

    <div class="curtain" id="curtain" data-open="true">
      <h1>Seedhe<em>Maut</em></h1>
      <p>
        A rooftop in Delhi after dark. Tap in and the set starts — the city moves with the
        bassline. Thirty seconds a track; the full ones are a click away.
      </p>
      <button class="enter" id="enter" type="button">Chadh ja chhat pe</button>
      <div class="hint">space · play &nbsp;&nbsp; ← → · skip</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
